name: chatbud
description: "On-device and local-network AI chat built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  ffi: ^2.1.3
  file_picker: ^8.1.4
  # 0.2.x exposes bindings but does not bundle the Android runtime. The
  # 0.9.0 development line provides verified Android native assets.
  llama_cpp_dart: 0.9.0-dev.12

  cupertino_icons: ^1.0.8
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/
